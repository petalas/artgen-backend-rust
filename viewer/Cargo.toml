[package]
name = "artgen-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "HtmlImageElement",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Document",
    "Window",
    "Element",
    "Event",
    "ErrorEvent",
    "CloseEvent",
    "BinaryType",
    "FileReader",
    "FileList",
    "File",
    "HtmlInputElement",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
gloo-timers = "0.3"
