services:
  gpu:
    build: .
    ports:
      - "9001:9001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - ./output:/data
    devices:
      - /dev/dxg:/dev/dxg
    command: ["ff.jpg", "--gpu", "--headless"]
