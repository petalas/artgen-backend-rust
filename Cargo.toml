[workspace]
members = ["shared", "viewer"]

[package]
name = "artgen-backend-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
artgen-shared = { path = "shared" }
anyhow = "1.0.104"
base64 = "0.23"
bytemuck = { version = "1.25.2", features = ["derive"] }
divan = "0.1.21"
futures = "0.3.34"
futures-intrusive = "0.5.0"
futures-lite = "2.6.1"
image = "0.25.10"
num_cpus = "1.17.0"
rand = "0.10.3"
sdl2 = "0.38.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tungstenite = "0.30"
uuid = { version = "1", features = ["v4"] }
wgpu = "30.0.1"

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
debug = true
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'abort'
incremental = true
codegen-units = 1
rpath = true

[profile.bench]
inherits = "release"
